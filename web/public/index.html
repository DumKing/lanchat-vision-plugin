<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉识别</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div><small>LanChat 官方插件</small><h1>视觉识别</h1><p>摄像头采样、人员特征与模型运行由独立签名进程处理。</p></div><span id="status">等待运行时</span></header><section class="grid"><article><h2>运行状态</h2><p id="runtime">插件启动后显示当前模型和采样状态。</p><button id="refresh">刷新</button></article><article><h2>模型中心</h2><p>模型资源由视觉插件单独下载和校验，不进入 LanChat 核心安装包。</p></article><article><h2>人物库</h2><p>人物特征保存在插件私有数据空间，宿主无法被其他插件读取。</p></article></section></main><script type="module" src="./main.js"></script></body></html>
