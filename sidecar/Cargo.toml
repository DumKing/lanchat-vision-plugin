[package]
name = "lanchat-vision-sidecar"
version = "0.8.0"
edition = "2021"

[features]
default = []
openvino-runtime = ["dep:openvino", "dep:openvino-sys"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = "2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
openvino = { version = "0.11.0", default-features = false, features = ["runtime-linking"], optional = true }
openvino-sys = { version = "0.11.0", default-features = false, features = ["runtime-linking"], optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
